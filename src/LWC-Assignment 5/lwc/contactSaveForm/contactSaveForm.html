<template>
<template if:true={isShowModal}> 

<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
   
<div class="slds-modal__container">
<!-- modal header start -->
  <header class="slds-modal__header">
     <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
        <lightning-icon icon-name="utility:close"
           alternative-text="close"
           variant="inverse"
           size="small" ></lightning-icon>
        <span class="slds-assistive-text">Close</span>
     </button>
     <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate"> New Contact</h2>
  </header>

  <!-- modal body start -->
<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
  <lightning-card>
          
          <div class="slds-p-around_medium lgc-bg">
            <lightning-input type="text" label="FirstName" onchange={handlechange}></lightning-input>
          </div>
          <div class="slds-p-around_medium lgc-bg">
            <lightning-input type="text" label="LastName" onchange={handlechange} required></lightning-input>
          </div>
          <div class="slds-p-around_medium lgc-bg">
            <lightning-input type="email" label="Email" onchange={handlechange}></lightning-input>
          </div>
          <div class="slds-p-around_medium lgc-bg">
            <lightning-input type="number" label="Phone" onchange={handlechange}></lightning-input>
          </div>
     <template lwc:if={errorMessage}>
        <p class="slds-text-color_error">{errorMessage}</p>
     </template>
   
  </lightning-card>
</div>

  <!-- modal footer start-->
  <footer class="slds-modal__footer">

     <button class="slds-button slds-button_neutral" onclick={saveRecord}>Save</button> 
         
     <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>

  </footer>

</div>

</section>

<!-- modal end -->
</template>
</template>
