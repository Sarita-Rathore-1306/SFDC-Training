<template>
<template if:true={isShowModal}>

<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
   
<div class="slds-modal__container">
  <!-- modal header start -->
  <header class="slds-modal__header">
     <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
        <lightning-icon icon-name="utility:close"
           alternative-text="close"
           variant="inverse"
           size="small" ></lightning-icon>
        <span class="slds-assistive-text">Close</span>
     </button>
     <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate"> New Account</h2>
  </header>

  <!-- modal body start -->
    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">

    <lightning-record-edit-form
        object-api-name="Account"
        onsuccess={handleSuccess}>
        <!-- Add your form fields here -->
        <lightning-messages></lightning-messages>
        <lightning-input-field field-name="Name"></lightning-input-field>
        <lightning-button class="slds-m-top_small" variant="brand" type="submit" name="save" label="Save" onclick={handleClick}></lightning-button>
    </lightning-record-edit-form>

    </div>

</div>
</section>
</template>

    <template if:true={showSecondModal}> 
        <c-contact-save-form account-id = {recordId} ></c-contact-save-form>
    </template>

</template>
