<template>
<template if:true={showSecondModal}>
<!-- Modal Design -->
<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
   
<div class="slds-modal__container">
   <!-- modal header start -->
   <header class="slds-modal__header">
     <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
        <lightning-icon icon-name="utility:close"
           alternative-text="close"
           variant="inverse"
           size="small" ></lightning-icon>
        <span class="slds-assistive-text">Close</span>
     </button>
     <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate"> New Contact</h2>
   </header>

   <!-- modal body start -->
   <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
   <!-- I have used Lightinig edit form to create record -->
    <lightning-record-edit-form
        object-api-name="Contact"
        onsuccess={handleSuccess}>
        <lightning-messages></lightning-messages>
        
        <!-- Fields for the form -->
        <lightning-input-field field-name="FirstName"></lightning-input-field>
        <lightning-input-field field-name="LastName"></lightning-input-field>
        <lightning-input-field field-name="Email"></lightning-input-field>
        <lightning-input-field field-name="Phone"></lightning-input-field>
        <lightning-input-field field-name="AccountId" value={accountId}></lightning-input-field>
        
        <lightning-button class="slds-m-top_small" variant="brand" type="submit" name="save" label="Save"></lightning-button>
    </lightning-record-edit-form>
   </div>

</div>

</section>

</template>
</template>
